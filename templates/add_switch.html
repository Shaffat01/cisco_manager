{% extends "base.html" %}
{% block content %}
<div class="container mt-4" style="max-width:550px;">
    <div class="glass-card" style="padding: 40px;">
        <div class="text-center mb-4">
            <div style="font-size:50px; color:var(--primary); filter: drop-shadow(0 0 20px var(--primary)); margin-bottom:15px;">
                <i class="fa-solid fa-network-wired"></i>
            </div>
            <h3 class="text-primary-glow">Add New Switch</h3>
            <p style="color:var(--muted);">Register a new Cisco switch to the network inventory</p>
        </div>

        <form method="POST">
            <div class="mb-3">
                <label class="form-label" style="color:var(--primary); font-size:12px; text-transform:uppercase; letter-spacing:1px; font-weight:600;">Switch Hostname</label>
                <input type="text" name="name" class="cyber-input" required placeholder="NOC-SW-2">
            </div>
            <div class="mb-3">
                <label class="form-label" style="color:var(--primary); font-size:12px; text-transform:uppercase; letter-spacing:1px; font-weight:600;">IP Address</label>
                <input type="text" name="ip" class="cyber-input mono" required placeholder="192.168.102.6">
            </div>
            <div class="mb-4">
                <label class="form-label" style="color:var(--primary); font-size:12px; text-transform:uppercase; letter-spacing:1px; font-weight:600;">
                    Enable Password <span style="color:var(--muted);">(Optional • Catalyst Only)</span>
                </label>
                <input type="password" name="enable_pass" class="cyber-input" placeholder="Leave blank if not needed">
            </div>

            <div class="alert" style="background:rgba(0,212,255,0.05); border:1px solid rgba(0,212,255,0.2); border-radius:10px; color:var(--light); font-size:13px;">
                <i class="fa-solid fa-shield-halved text-primary-glow me-2"></i>
                Username, Password & Port are managed via central credentials.
            </div>

            <button type="submit" class="btn-neon w-100" style="justify-content:center; padding:14px; font-size:15px;">
                <i class="fa-solid fa-plus"></i>Register Switch
            </button>
        </form>
    </div>
</div>

<style>
.cyber-input {
    width: 100%;
    background: var(--dark-3);
    border: 1px solid rgba(0,212,255,0.2);
    color: white;
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 14px;
    transition: all 0.3s;
    font-family: 'Inter', sans-serif;
}

.cyber-input:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 20px rgba(0,212,255,0.3);
    background: var(--dark-4);
}

.cyber-input::placeholder { color: var(--muted); }
</style>
{% endblock %}
