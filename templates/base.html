<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}NetScan Pro{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00d4ff;
            --secondary: #7c3aed;
            --accent: #ff006e;
            --success: #00f5a0;
            --warning: #ffaa00;
            --danger: #ff3860;
            --dark-1: #0a0e27;
            --dark-2: #131836;
            --dark-3: #1a1f3a;
            --dark-4: #232849;
            --light: #e2e8f0;
            --muted: #64748b;
            --glow: 0 0 20px rgba(0, 212, 255, 0.5);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--dark-1);
            color: var(--light);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated Background */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: 
                radial-gradient(circle at 20% 20%, rgba(124, 58, 237, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0, 212, 255, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(255, 0, 110, 0.05) 0%, transparent 50%);
            z-index: -2;
            animation: bgShift 20s ease-in-out infinite;
        }

        @keyframes bgShift {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.1) rotate(5deg); }
        }

        /* Grid Overlay */
        body::after {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -1;
            pointer-events: none;
        }

        /* Top Navbar */
        .top-nav {
            background: rgba(19, 24, 54, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0, 212, 255, 0.2);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
            transition: all 0.3s;
        }

        .brand:hover { transform: scale(1.02); }

        .brand i {
            font-size: 28px;
            color: var(--primary);
            filter: drop-shadow(0 0 10px var(--primary));
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .nav-links {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .btn-neon {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0, 212, 255, 0.3);
            position: relative;
            overflow: hidden;
        }

        .btn-neon::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s;
        }

        .btn-neon:hover::before { left: 100%; }
        .btn-neon:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 212, 255, 0.5);
            color: white;
        }

        .btn-outline-neon {
            background: transparent;
            color: var(--primary);
            border: 1px solid var(--primary);
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }

        .btn-outline-neon:hover {
            background: rgba(0, 212, 255, 0.1);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
            color: var(--primary);
        }

        /* Glass Card */
        .glass-card {
            background: rgba(26, 31, 58, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 212, 255, 0.15);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .glass-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .glass-card:hover::before { opacity: 1; }
        .glass-card:hover {
            border-color: rgba(0, 212, 255, 0.4);
            transform: translateY(-3px);
        }

        /* Flash Messages */
        .flash-container {
            position: fixed;
            top: 80px;
            right: 20px;
            z-index: 9999;
            max-width: 400px;
        }

        .flash-msg {
            background: rgba(19, 24, 54, 0.95);
            backdrop-filter: blur(20px);
            border-left: 4px solid var(--primary);
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            animation: slideInRight 0.4s ease-out;
        }

        .flash-msg.success { border-left-color: var(--success); }
        .flash-msg.danger { border-left-color: var(--danger); }
        .flash-msg.warning { border-left-color: var(--warning); }

        @keyframes slideInRight {
            from { transform: translateX(400px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--dark-2); }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(var(--primary), var(--secondary));
            border-radius: 4px;
        }

        /* Typography */
        h1, h2, h3, h4, h5, h6 { color: white; font-weight: 700; }
        .text-glow { text-shadow: 0 0 10px currentColor; }
        .mono { font-family: 'JetBrains Mono', monospace; }

        /* Utility */
        .text-primary-glow { color: var(--primary); text-shadow: 0 0 10px var(--primary); }
        .text-success-glow { color: var(--success); text-shadow: 0 0 10px var(--success); }
        .text-danger-glow { color: var(--danger); text-shadow: 0 0 10px var(--danger); }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>

<!-- Top Navigation -->
<nav class="top-nav">
    <a href="/" class="brand">
        <i class="fa-solid fa-network-wired"></i>
        NetScan Pro
    </a>
    <div class="nav-links">
        <a href="/" class="btn-outline-neon"><i class="fa-solid fa-gauge-high"></i>Dashboard</a>
        <a href="/add" class="btn-neon"><i class="fa-solid fa-plus"></i>Add Switch</a>
    </div>
</nav>

<!-- Flash Messages -->
{% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    <div class="flash-container">
        {% for cat, msg in messages %}
        <div class="flash-msg {{ cat }}">
            <i class="fa-solid {% if cat == 'success' %}fa-circle-check text-success-glow{% elif cat == 'danger' %}fa-circle-xmark text-danger-glow{% else %}fa-info-circle{% endif %}"></i>
            <span>{{ msg }}</span>
        </div>
        {% endfor %}
    </div>
    {% endif %}
{% endwith %}

{% block content %}{% endblock %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Auto hide flash messages
    setTimeout(() => {
        document.querySelectorAll('.flash-msg').forEach(m => {
            m.style.animation = 'slideInRight 0.4s reverse';
            setTimeout(() => m.remove(), 400);
        });
    }, 4000);
</script>
{% block scripts %}{% endblock %}
</body>
</html>
